apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: garage-microservices
spec:
  replicas: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: billing-service }
  template:
    metadata:
      labels: { app: billing-service }
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/kmlyteixeira/garage-management-billing-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Billing
              valueFrom: { secretKeyRef: { name: garage-database, key: billing-connection-string } }
            - name: MERCADOPAGO_ACCESS_TOKEN
              valueFrom: { secretKeyRef: { name: garage-payment, key: mercadopago-access-token } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom: { secretKeyRef: { name: garage-observability, key: otlp-endpoint, optional: true } }
            - name: ExternalJwt__Enabled
              value: "false"
            - name: ExternalJwt__Issuer
              valueFrom: { secretKeyRef: { name: garage-auth, key: issuer, optional: true } }
            - name: ExternalJwt__Audience
              valueFrom: { secretKeyRef: { name: garage-auth, key: audience, optional: true } }
            - name: ExternalJwt__PublicKeyPem
              valueFrom: { secretKeyRef: { name: garage-auth, key: public-key-pem, optional: true } }
            - name: RabbitMq__Uri
              value: amqp://guest:guest@rabbitmq:5672/
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: garage-microservices
spec:
  selector: { app: billing-service }
  ports: [{ port: 8080, targetPort: 8080 }]
