name: Billing Terraform apply

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-lab
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: garage-management
      TF_VAR_environment: ${{ vars.TERRAFORM_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Load platform parameters
        run: |
          echo "TF_VAR_cluster_name=$(aws ssm get-parameter --name "/garage-management/${TF_VAR_environment}/platform/cluster-name" --query Parameter.Value --output text)" >> "$GITHUB_ENV"
          echo "TF_CLI_ARGS_init=-backend-config=bucket=$(aws ssm get-parameter --name "/garage-management/${TF_VAR_environment}/platform/service-state-bucket" --query Parameter.Value --output text) -backend-config=key=billing/terraform.tfstate -backend-config=region=${TF_VAR_region}" >> "$GITHUB_ENV"
      - run: terraform init
      - run: terraform plan -out=tfplan
      - run: terraform apply -auto-approve tfplan
