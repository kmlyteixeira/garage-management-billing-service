name: Billing Terraform apply

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: aws-lab
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: garage-management
      TF_VAR_environment: ${{ vars.TERRAFORM_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Load platform parameters
        run: |
          echo "TF_VAR_cluster_name=$(aws ssm get-parameter --name "/garage-management/${TF_VAR_environment}/platform/cluster-name" --query Parameter.Value --output text)" >> "$GITHUB_ENV"
          echo "TF_CLI_ARGS_init=-backend-config=bucket=$(aws ssm get-parameter --name "/garage-management/${TF_VAR_environment}/platform/service-state-bucket" --query Parameter.Value --output text) -backend-config=key=billing/terraform.tfstate -backend-config=region=${TF_VAR_region}" >> "$GITHUB_ENV"
      - run: terraform init
      - name: Migrate deployment state identity
        run: |
          if terraform state list | grep -Fxq "kubernetes_deployment_v1.service"; then
            terraform state rm kubernetes_deployment_v1.service
            terraform import kubernetes_deployment_v1.service garage-microservices/billing-service
          fi
      - run: terraform plan -out=tfplan
      - name: Apply Terraform
        run: |
          set +e
          terraform apply -auto-approve tfplan
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Billing deployment status"
            kubectl get deployment billing-service -n garage-microservices -o wide || true
            kubectl get pods -n garage-microservices -l app=billing-service -o wide || true
            kubectl describe deployment billing-service -n garage-microservices || true
            kubectl get events -n garage-microservices --sort-by=.lastTimestamp | tail -n 40 || true
            echo "::endgroup::"
            exit "$status"
          fi
